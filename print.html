<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천교통공사 비상 위치안내 표지판 인쇄 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,700,1,0"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        @page {
            size: A4 landscape;
            margin: 0;
        }

        @media print {
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                min-h-screen: 100vh !important;
            }

            .no-print {
                display: none !important;
            }

            .signage-frame {
                box-shadow: none !important;
                margin: 0 auto !important;
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>

<body class="bg-slate-200 min-h-screen flex flex-col items-center justify-center p-6 text-slate-900">

    <!-- [상단 관리자 컨트롤 툴바 (인쇄 시 자동 숨김)] -->
    <header
        class="no-print w-full max-w-[840px] mb-6 bg-slate-900 text-white p-4 rounded-2xl shadow-xl border border-slate-800 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-[#ED8B00] flex items-center justify-center text-white shadow-md">
                <span class="material-symbols-outlined !text-[24px]">print</span>
            </div>
            <div class="flex flex-col">
                <h1 class="text-base font-extrabold text-white tracking-tight">표지판 인쇄 시스템</h1>
                <span class="text-xs text-slate-400">원하는 역과 위치를 선택 후 바로 인쇄할 수 있습니다.</span>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2.5">
            <!-- 역 선택 드롭다운 -->
            <select id="select-station"
                class="bg-slate-800 text-white font-bold text-xs px-3 py-2 rounded-xl border border-slate-700 focus:outline-none focus:border-[#ED8B00] cursor-pointer">
                <option value="">역 선택 중...</option>
            </select>

            <!-- 위치 선택 드롭다운 (폭 조절 적용) -->
            <select id="select-place"
                class="bg-slate-800 text-white font-bold text-xs px-3 py-2 rounded-xl border border-slate-700 focus:outline-none focus:border-[#ED8B00] max-w-[220px] truncate cursor-pointer">
                <option value="">위치 선택 중...</option>
            </select>

            <!-- [신규] 현재위치 문구 직접 수정 인풋창 -->
            <div class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1.5 focus-within:border-[#ED8B00]" title="선택한 위치 문구를 직접 수정할 수 있습니다">
                <span class="material-symbols-outlined text-[#ED8B00] !text-[16px]">edit</span>
                <input id="input-custom-place" type="text" placeholder="현재위치 문구 직접 수정..." 
                    class="bg-transparent text-white font-bold text-xs outline-none w-44 placeholder-slate-500">
            </div>

            <!-- 모바일 웹 미리보기 바로가기 -->
            <a id="btn-view-mobile" href="#" target="_blank"
                class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition-all flex items-center gap-1.5 text-slate-200">
                <span class="material-symbols-outlined !text-[16px]">open_in_new</span>
                모바일
            </a>

            <!-- 인쇄하기 버튼 -->
            <button onclick="window.print()"
                class="px-4 py-2 bg-[#ED8B00] hover:bg-amber-600 text-white font-black text-xs rounded-xl shadow-md transition-all flex items-center gap-1.5 cursor-pointer">
                <span class="material-symbols-outlined !text-[18px]">print</span>
                인쇄하기
            </button>
        </div>
    </header>

    <!-- [프리미엄 비상 위치안내 표지판 본체] -->
    <main
        class="signage-frame w-[800px] h-[540px] bg-white rounded-3xl border-[14px] border-[#ED8B00] shadow-2xl p-7 flex flex-col justify-between shrink-0 relative overflow-hidden">

        <!-- 상단 헤더: 호선 & 역명 & 긴급안내 QR코드 -->
        <div class="flex items-center justify-between border-b-4 border-slate-900 pb-4">
            <div class="flex flex-col gap-1.5">
                <div class="flex items-center gap-3">
                    <span
                        class="bg-[#ED8B00] text-white text-sm font-black px-3.5 py-1 rounded-lg shadow-sm tracking-wide">인천2호선</span>
                    <h1 id="sign-station-name" class="text-4xl font-black text-slate-900 tracking-tight">가정역</h1>
                </div>
                <h2 class="text-xl font-black text-[#ED8B00] tracking-tight flex items-center gap-1.5">
                    <span>비상 위치안내</span>
                    <span class="text-slate-400 text-base font-extrabold">/</span>
                    <span>긴급 연락처</span>
                </h2>
            </div>

            <!-- QR코드 스캔 박스 -->
            <div class="flex items-center gap-3 bg-slate-50 border-2 border-slate-200 rounded-2xl p-2.5 shadow-inner">
                <div class="flex flex-col items-end justify-center pr-1 gap-1">
                    <span
                        class="bg-rose-600 text-white text-[11px] font-black px-2.5 py-0.5 rounded-full shadow-sm">긴급연락
                        바로콜</span>
                    <span class="text-[12px] font-bold text-slate-700 flex items-center gap-0.5">
                        카메라 스캔
                        <span class="material-symbols-outlined !text-[14px]">arrow_forward</span>
                    </span>
                    <span id="sign-id-badge"
                        class="text-[10px] font-mono font-extrabold text-slate-500 bg-slate-200/80 px-1.5 py-0.5 rounded">ID:
                        -</span>
                </div>
                <div
                    class="w-32 h-32 bg-white border border-slate-300 rounded-xl p-1.5 flex items-center justify-center shadow-sm shrink-0">
                    <canvas id="qr-code-canvas" class="w-full h-full object-contain"></canvas>
                </div>
            </div>
        </div>

        <!-- 본문 캡슐 바: 긴급연락처 + 현재위치 -->
        <div class="flex flex-col gap-4 my-auto">

            <!-- 1. 긴급연락처 패널 -->
            <div class="flex items-center bg-[#ED8B00] rounded-2xl p-3 shadow-md border border-amber-600/30">
                <div class="w-44 flex items-center gap-2.5 text-white pl-3 shrink-0">
                    <span class="material-symbols-outlined !text-[34px]">phone_in_talk</span>
                    <span class="text-2xl font-black tracking-tight">긴급연락처</span>
                </div>
                <div
                    class="flex-grow bg-slate-950 rounded-xl py-2.5 px-6 flex items-center justify-center border border-slate-800 shadow-inner">
                    <span id="sign-phone" class="text-4xl font-black text-[#FFE600] tracking-wider font-mono">032)
                        451-4311</span>
                </div>
            </div>

            <!-- 2. 현재위치 패널 (상단 입력창 및 직접 클릭 수정 기능 적용) -->
            <div class="flex items-center bg-[#ED8B00] rounded-2xl p-3 shadow-md border border-amber-600/30">
                <div class="w-44 flex items-center gap-2.5 text-white pl-3 shrink-0">
                    <span class="material-symbols-outlined !text-[34px]">location_on</span>
                    <span class="text-2xl font-black tracking-tight">현재위치</span>
                </div>
                <div
                    class="flex-grow bg-slate-950 rounded-xl h-[68px] px-4 flex items-center justify-center border border-slate-800 shadow-inner text-center overflow-hidden">
                    <span id="sign-place" contenteditable="true" spellcheck="false" title="클릭하여 문구를 직접 수정할 수 있습니다"
                        class="text-3xl font-black text-[#FFE600] tracking-tight break-keep leading-tight text-center w-full outline-none focus:bg-slate-900/60 rounded px-1 cursor-text transition-colors">가정역
                        에스컬레이터 1호기</span>
                </div>
            </div>

        </div>

        <!-- 하단 푸터 브랜딩 & 비상 안내 가이드 -->
        <div class="flex items-center justify-between pt-2.5 border-t-2 border-slate-200">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-[#ED8B00]"></span>
                <span class="text-xs font-bold text-slate-600">비상시 119/112 또는 상기 긴급연락처로 현재위치를 말씀해 주세요.</span>
            </div>
            <div class="flex items-center gap-1">
                <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest">Incheon Transit
                    Corporation</span>
            </div>
        </div>

    </main>

    <!-- 외부 위치 데이터 파일 -->
    <script src="data.js"></script>

    <script>
        const App = {
            currentId: null,
            stations: [],
            placesByStation: {}
        };

        function parseData() {
            if (typeof placeData === 'undefined' || !placeData) {
                console.error('placeData가 존재하지 않거나 data.js 로드 실패');
                return;
            }

            Object.keys(placeData).forEach(id => {
                const item = placeData[id];
                const station = item.station || '미정역';

                if (!App.placesByStation[station]) {
                    App.placesByStation[station] = [];
                    App.stations.push(station);
                }

                App.placesByStation[station].push({
                    id: id,
                    ...item
                });
            });
        }

        function buildSelects() {
            const stationSelect = document.getElementById('select-station');
            const placeSelect = document.getElementById('select-place');
            if (!stationSelect || !placeSelect) return;

            stationSelect.innerHTML = App.stations.map(st =>
                `<option value="${st}">${st}</option>`
            ).join('');

            stationSelect.addEventListener('change', (e) => {
                const selectedStation = e.target.value;
                populatePlaceSelect(selectedStation);
                const firstPlace = App.placesByStation[selectedStation]?.[0];
                if (firstPlace) {
                    updateSignage(firstPlace.id);
                }
            });

            placeSelect.addEventListener('change', (e) => {
                updateSignage(e.target.value);
            });
        }

        function populatePlaceSelect(stationName, selectId = null) {
            const placeSelect = document.getElementById('select-place');
            if (!placeSelect) return;

            const places = App.placesByStation[stationName] || [];
            placeSelect.innerHTML = places.map(p => {
                const isSel = p.id === selectId ? 'selected' : '';
                return `<option value="${p.id}" ${isSel}>${p.title}</option>`;
            }).join('');
        }

        // 💡 텍스트 길이에 따른 폰트 자동 계산 및 크기 축소 알고리즘
        function fitPlaceText() {
            const placeEl = document.getElementById('sign-place');
            if (!placeEl) return;

            const container = placeEl.parentElement;
            if (!container) return;

            let fontSize = 30; // 기본 30px (text-3xl)
            placeEl.style.fontSize = `${fontSize}px`;

            // 패널 높이나 너비를 초과하면 초과하지 않을 때까지 폰트 크기 줄임 (최저 15px)
            while (fontSize > 15 && (placeEl.scrollHeight > container.clientHeight - 8 || placeEl.scrollWidth > container.clientWidth - 16)) {
                fontSize -= 1;
                placeEl.style.fontSize = `${fontSize}px`;
            }
        }

        function bindCustomPlaceEvents() {
            const inputCustom = document.getElementById('input-custom-place');
            const signPlace = document.getElementById('sign-place');
            if (!inputCustom || !signPlace) return;

            // 1. 상단 툴바 인풋창 수정 시 ➔ 표지판 텍스트 실시간 반영 및 폰트 크기 자동 조절
            inputCustom.addEventListener('input', (e) => {
                signPlace.innerText = e.target.value;
                fitPlaceText();
            });

            // 2. 표지판 직접 클릭 및 키보드 입력 시 ➔ 상단 인풋창 동기화 및 폰트 크기 자동 조절
            signPlace.addEventListener('input', () => {
                inputCustom.value = signPlace.innerText;
                fitPlaceText();
            });
        }

        function updateSignage(id) {
            if (!placeData || !placeData[id]) return;

            App.currentId = id;
            const data = placeData[id];

            // 1. 역명 및 위치 텍스트 반영
            const stationEl = document.getElementById('sign-station-name');
            const placeEl = document.getElementById('sign-place');
            const phoneEl = document.getElementById('sign-phone');
            const badgeEl = document.getElementById('sign-id-badge');
            const btnMobile = document.getElementById('btn-view-mobile');
            const inputCustom = document.getElementById('input-custom-place');

            if (stationEl) stationEl.innerText = data.station || '';
            
            const titleText = data.title || '';
            if (placeEl) {
                placeEl.innerText = titleText;
                fitPlaceText(); // 텍스트 변경 후 폰트 자동 크기 조절 실행
            }
            if (inputCustom) {
                inputCustom.value = titleText;
            }

            // 전화번호 포맷팅
            let rawPhone = data.phone || '';
            let formattedPhone = rawPhone.replace(/^(\d{3})-(\d{3,4})-(\d{4})$/, '$1) $2-$3');
            if (phoneEl) phoneEl.innerText = formattedPhone || rawPhone;

            if (badgeEl) badgeEl.innerText = `ID: ${id}`;

            // 모바일 바로가기 링크 업데이트
            const targetMobileUrl = new URL(`index.html?id=${id}`, window.location.href).href;
            if (btnMobile) btnMobile.href = targetMobileUrl;

            // 드롭다운 위치 맞춤
            const stationSelect = document.getElementById('select-station');
            if (stationSelect && stationSelect.value !== data.station) {
                stationSelect.value = data.station;
                populatePlaceSelect(data.station, id);
            } else {
                const placeSelect = document.getElementById('select-place');
                if (placeSelect) placeSelect.value = id;
            }

            // 2. QR 코드 동적 생성
            const canvas = document.getElementById('qr-code-canvas');
            if (typeof QRious !== 'undefined' && canvas) {
                new QRious({
                    element: canvas,
                    value: targetMobileUrl,
                    size: 140,
                    level: 'H'
                });
            }

            // URL 쿼리 파라미터 갱신
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('id', id);
            window.history.replaceState({}, '', newUrl);
        }

        function init() {
            parseData();
            buildSelects();
            bindCustomPlaceEvents();

            const urlParams = new URLSearchParams(window.location.search);
            let initialId = urlParams.get('id');

            if (!initialId || !placeData[initialId]) {
                const firstStation = App.stations[0];
                if (firstStation && App.placesByStation[firstStation]?.[0]) {
                    initialId = App.placesByStation[firstStation][0].id;
                }
            }

            if (initialId) {
                const station = placeData[initialId]?.station;
                if (station) {
                    populatePlaceSelect(station, initialId);
                }
                updateSignage(initialId);
            }

            // 창 크기 변경 시에도 폰트 크기 재계산
            window.addEventListener('resize', fitPlaceText);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
